[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "document-search-api"
version = "0.2.0"
description = "A support knowledge base backend with versioned guides and ranked search."
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{name = "Kasra Mohebian"}]
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0"]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
