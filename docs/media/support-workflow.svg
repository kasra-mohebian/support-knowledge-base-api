   <g id="text_1">
    <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17373d" x="40.32" y="49.68" transform="rotate(-0 40.32 49.68)">Support guides: from creation to a safe correction</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #51666b" x="40.32" y="77.76" transform="rotate(-0 40.32 77.76)">API workflow illustration · fictional guide · documented behavior, not a product screenshot</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="64.8" y="151.177422" transform="rotate(-0 64.8 151.177422)">01</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17373d" x="87.12" y="152.64" transform="rotate(-0 87.12 152.64)">Create a guide</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #51666b" x="59.04" y="185.76" transform="rotate(-0 59.04 185.76)">POST /documents</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #51666b" x="59.04" y="206.64" transform="rotate(-0 59.04 206.64)">Category: delivery · initial version: 1</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #51666b" x="59.04" y="227.52" transform="rotate(-0 59.04 227.52)">201 Created + document location</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="501.12" y="151.177422" transform="rotate(-0 501.12 151.177422)">02</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17373d" x="523.44" y="152.64" transform="rotate(-0 523.44 152.64)">Find the relevant passage</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #51666b" x="495.36" y="185.76" transform="rotate(-0 495.36 185.76)">GET /search?q=track+my+parcel</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #51666b" x="495.36" y="206.64" transform="rotate(-0 495.36 206.64)">Ranked excerpts + source + current version</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #51666b" x="495.36" y="227.52" transform="rotate(-0 495.36 227.52)">Optional category and any/all word matching</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="64.8" y="331.897422" transform="rotate(-0 64.8 331.897422)">03</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17373d" x="87.12" y="333.36" transform="rotate(-0 87.12 333.36)">Save a correction</text>
   </g>
   <g id="text_15">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #51666b" x="59.04" y="366.48" transform="rotate(-0 59.04 366.48)">PUT /documents/{id} · expected_version: 1</text>
   </g>
   <g id="text_16">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #51666b" x="59.04" y="387.36" transform="rotate(-0 59.04 387.36)">Document + search index change together</text>
   </g>
   <g id="text_17">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #51666b" x="59.04" y="408.24" transform="rotate(-0 59.04 408.24)">200 OK · current version becomes 2</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="501.12" y="331.897422" transform="rotate(-0 501.12 331.897422)">04</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17373d" x="523.44" y="333.36" transform="rotate(-0 523.44 333.36)">Protect another editor’s work</text>
   </g>
   <g id="text_20">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #51666b" x="495.36" y="366.48" transform="rotate(-0 495.36 366.48)">A stale edit still submits version 1</text>
   </g>
   <g id="text_21">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #51666b" x="495.36" y="387.36" transform="rotate(-0 495.36 387.36)">409 Conflict · latest content is preserved</text>
   </g>
   <g id="text_22">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #51666b" x="495.36" y="408.24" transform="rotate(-0 495.36 408.24)">Read version 2 and reconcile before retrying</text>
   </g>
   <g id="text_23">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14545a" x="40.32" y="493.2" transform="rotate(-0 40.32 493.2)">One API key · local SQLite storage · no generated answers or external data calls</text>
